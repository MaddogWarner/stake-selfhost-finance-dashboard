# Deployment using prebuilt images from GHCR (no local build required).
#
#   cp ../.env.example ../.env   # then edit (FMP/Stake optional)
#   TAG=0.2.0 docker compose -f docker-compose.ghcr.yml up -d
#
# The frontend serves the UI and proxies /api to the backend over the internal
# network, so only the frontend port is published. Backend runs DB migrations on
# startup. Override the published address with FRONTEND_BIND (default 127.0.0.1:3000).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stake
      POSTGRES_PASSWORD: stake
      POSTGRES_DB: stake_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stake"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    image: ghcr.io/maddogwarner/stake-selfhost-finance-dashboard/backend:${TAG:-latest}
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/maddogwarner/stake-selfhost-finance-dashboard/frontend:${TAG:-latest}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
