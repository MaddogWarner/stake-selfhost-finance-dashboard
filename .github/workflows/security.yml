name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python audit tools
        run: pip install pip-audit bandit semgrep

      - name: pip-audit
        run: pip-audit || true

      - name: Bandit SAST
        run: bandit -r . -ll -x ./.git,./node_modules,./frontend --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: npm audit
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm audit --audit-level=high || true
          elif [ -f package.json ]; then
            npm audit --audit-level=high || true
          fi

      - name: Semgrep
        run: semgrep --config=p/default --config=p/secrets --config=p/owasp-top-ten --error --quiet || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
